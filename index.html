<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول KING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255,215,0,0.1);
            border: 3px solid #FFD700;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px #FFD700;
        }
        h1 { color: #FFD700; margin-bottom: 30px; font-size: 2.5rem; }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #FFD700;
            border-radius: 10px;
            background: #111;
            color: #FFD700;
            font-size: 1.1rem;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #FFD700;
            color: #000;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>👑 تسجيل دخول KING 👑</h1>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Enter Mission</button>
    </div>
    <script>
        function login() {
            let u = document.getElementById('user').value.trim().toUpperCase();
            let p = document.getElementById('pass').value.trim();
            if (u === 'ABDO' && p === '1') {
                document.body.innerHTML = '<h1 style="color:#FFD700;text-align:center;margin-top:40vh;font-size:3rem;">أهلاً بالمحترفين 👑</h1>';
            } else {
                alert('بيانات غلط يا KING - انت كتبت: ' + u + ' / ' + p);
            }
        }
    </script>
</body>
</html>
