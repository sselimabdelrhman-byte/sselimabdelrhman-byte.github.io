<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموسوعة الدينية الملكية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0d4f3c 0%, #1a6b4d 50%, #0d4f3c 100%);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(0,0,0,0.75);
            border: 4px solid #FFD700;
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,215,0,0.6);
        }
        .logo-frame {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #FFD700;
            margin: 0 auto 25px;
            padding: 5px;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FFD700);
            box-shadow: 0 0 30px #FFD700;
        }
        .logo-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0d4f3c;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px #FFD700;
            margin-bottom: 5px;
        }
        h2 {
            font-size: 2rem;
            color: #FFD700;
            margin-bottom: 25px;
        }
        p {
            font-size: 1.3rem;
            line-height: 1.9;
            color: #f5f5f5;
            margin-bottom: 35px;
        }
        .btn {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #0d4f3c;
            border: none;
            padding: 18px 45px;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255,215,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-frame">
            <img src="Abdo.jpg" alt="KING">
        </div>
        
        <h1>👑 الموسوعة الدينية 👑</h1>
        <h2>الملكية العالمية</h2>
        
        <p>
            رحلة إيمانية شاملة<br>
            في علوم القرآن الكريم والسنة النبوية<br>
            والسيرة العطرة والتاريخ الإسلامي
        </p>
        
        <button class="btn" onclick="alert('قريباً بإذن الله - جاري بناء المحتوى')">
            الدخول للموسوعة
        </button>
    </div>
</body>
</html>
