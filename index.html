            background: #1a1a1a; padding: 30px; border-radius: 20px;
            border: 3px solid #FFD700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);

        }
        button {
            width: 100%; padding: 12px; background: #FFD700; color: #000;
            border: none; border-radius: 10px; font-size: 18px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #fff; }
        #platform { display: none; text-align: right; }
        .section { 
            background: #000; padding: 15px; border-radius: 15px;

        }
        .section h2 { color: #FFD700; margin-bottom: 10px; }
        .game-btn { background: #4CAF50; color: white; margin: 5px; width: auto; padding: 10px 20px; }
        #logoutBtn { background: #f44336; color: white; margin-top: 20px; }
    </style>
</head>
